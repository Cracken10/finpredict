version: '3.8'

# ------------------ Docker Secrets ------------------
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_user:
    file: ./secrets/mysql_user.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  mysql_database:
    file: ./secrets/mysql_database.txt
  mongo_root_username:
    file: ./secrets/mongo_root_username.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  news_api_key:
    file: ./secrets/news_api_key.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  jwt_refresh_key:
    file: ./secrets/jwt_refresh_key.txt

# ------------------ Red interna ------------------
networks:
  finpredict_net:
    aliases:
      - db
      - redis
      - mongo

# ------------------ Volúmenes persistentes ------------------
volumes:
  db_data:
  mongo_data:

services:

  # ------- MariaDB (usuarios y logs) -------
  db:
    image: mariadb:10.6
    restart: on-failure
    secrets:
      - mysql_root_password
      - mysql_user
      - mysql_password
      - mysql_database
    environment:
      MYSQL_ROOT_PASSWORD: /run/secrets/mysql_root_password
      MYSQL_USER:          /run/secrets/mysql_user
      MYSQL_PASSWORD:      /run/secrets/mysql_password
      MYSQL_DATABASE:      /run/secrets/mysql_database
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - finpredict_net
    ports:
      - '3306:3306'
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin", "ping",
          "-h", "localhost",
          "-u", "root",
          "--password=$(cat /run/secrets/mysql_root_password)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------- MongoDB (noticias) -------
  mongo:
    image: mongo:6
    restart: on-failure
    secrets:
      - mongo_root_username
      - mongo_root_password
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    volumes:
      - mongo_data:/data/db
    networks:
      - finpredict_net
    ports:
      - '27017:27017'
    healthcheck:
      test:
        [
          "CMD",
          "mongo",
          "--authenticationDatabase", "admin",
          "-u", "$(cat /run/secrets/mongo_root_username)",
          "-p", "$(cat /run/secrets/mongo_root_password)",
          "--eval", "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------- Redis (cache & blacklist JWT) -------
  redis:
    image: redis:7-alpine
    restart: on-failure
    networks:
      - finpredict_net
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------- FastAPI Backend -------
  backend:
    build:
      context: ./../backend
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER_FILE=/run/secrets/mysql_user
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
      - MYSQL_DATABASE_FILE=/run/secrets/mysql_database
      - MONGO_USERNAME_FILE=/run/secrets/mongo_root_username
      - MONGO_PASSWORD_FILE=/run/secrets/mongo_root_password
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - NEWS_API_KEY_FILE=/run/secrets/news_api_key
      - SECRET_KEY_FILE=/run/secrets/jwt_secret_key
      - REFRESH_SECRET_KEY_FILE=/run/secrets/jwt_refresh_key
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost       # vía Nginx
    ports:
      - '8000:8000'
    networks:
      - finpredict_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------- React Frontend -------
  frontend:
    build:
      context: ./../frontend
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=/             # proxy por Nginx
    ports:
      - '3000:3000'
    networks:
      - finpredict_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------- Nginx (SSL, estáticos, proxy) -------
  nginx:
    image: nginx:latest
    restart: on-failure
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/finpredict.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../frontend/build:/usr/share/nginx/html:ro
    networks:
      - finpredict_net
    ports:
      - "80:80"
      - "443:443"   # activar si generas los certificados SSL

volumes:
  db_data:
  mongo_data:
